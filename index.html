<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>OpenDrive 3D – Highway Rush</title><link rel="stylesheet" href="./style.css"></head>
<body>
<canvas id="c"></canvas>
 
<section id="menu" class="screen"><div class="card">
<div class="logo">OD<span>3D</span></div><h1>HIGHWAY RUSH</h1>
<p class="coins">Coins: <b>0</b></p>
<button class="primary" data-go="missions">PLAY</button>
<button data-go="garage">GARAGE</button>
<button data-go="settings">SETTINGS</button>
</div></section>
 
<section id="missions" class="screen hidden"><div class="card wide">
<h2>Missions</h2><p class="coins">Coins: <b>0</b></p>
<div id="mList" class="list"></div><button data-go="menu">Back</button>
</div></section>
 
<section id="garage" class="screen hidden"><div class="card wide">
<h2>Garage</h2><p class="coins">Coins: <b>0</b></p>
<div id="gList" class="list"></div><h2>Upgrades</h2><div id="uList" class="list"></div>
<button data-go="menu">Back</button>
</div></section>
 
<section id="settings" class="screen hidden"><div class="card wide">
<h2>Settings</h2>
<label>Sound <input type="checkbox" id="sSound"></label>
<label>Camera <select id="sCam"><option value="0">Chase</option><option value="1">Hood</option><option value="2">Far chase</option></select></label>
<h2>Achievements</h2><div id="achL" class="list"></div>
<button data-go="menu">Back</button>
</div></section>
 
<section id="pause" class="screen hidden"><div class="card"><h2>Paused</h2>
<button class="primary" data-act="resume">RESUME</button><button data-act="quit">QUIT TO MENU</button>
</div></section>
 
<section id="result" class="screen hidden"><div class="card">
<h1 id="rT"></h1><p id="rW"></p><div id="rS" class="list"></div>
<button class="primary" data-act="retry">RETRY</button>
<button data-go="missions">MISSIONS</button><button data-go="menu">MENU</button>
</div></section>
 
<div id="hud" class="hidden">
<div class="top">
<div class="chip"><small>TIME</small><b id="hT">0</b></div>
<div class="chip wide"><small id="hGoalL">GOAL</small><div class="bar"><i id="hGoal"></i></div><b id="hGoalT"></b></div>
<div class="chip"><small>SCORE</small><b id="hS">0</b></div>
<button data-act="pause">II</button>
</div>
<div class="left"><small>HEALTH</small><div class="bar red"><i id="hHp"></i></div><small>NITRO</small><div class="bar blue"><i id="hN"></i></div><small id="hStat"></small></div>
<div class="right"><div id="dial"><b id="hSp">0</b><small>km/h</small></div><div id="wheel"></div></div>
<div id="center"></div>
<div class="touch">
<div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
<div><button data-k="ShiftLeft">DRIFT</button><button data-k="Space">N2O</button><button data-k="ArrowDown">BRK</button><button data-k="ArrowUp">GO</button></div>
</div>
</div>
<div id="toast"></div>
 
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
<script type="module" src="./game.js"></script>
</body></html>
